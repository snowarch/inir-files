[package]
name = "inir-files-core"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The engine of iNiR Files: listing, thumbnails, file jobs, trash, devices and search, over JSON lines"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
notify = { version = "8", default-features = false }
trash = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "tga"] }
# Its own thread pool off: the thumbnail workers already run one picture per core.
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
imagesize = "0.13"
kamadak-exif = "0.6"
md-5 = "0.10"
sha2 = "0.10"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
# org.freedesktop.FileManager1 and org.freedesktop.impl.portal.FileChooser: pure Rust D-Bus.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
async-io = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
